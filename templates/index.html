<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Data from APEX</title>
</head>
<body>
<h1>Data from Oracle APEX</h1>
<ul>
    {% for item in items %}
        <li>ID: {{ item[0] }}, Name: {{ item[1] }}</li>
    {% endfor %}
</ul>
<h1>Raw Data</h1>
<pre>{{ items }}</pre>
<h1>Add an item</h1>
<form method="post">
        <label for="name">Name</label>
        <br>
    <input type="text" name="name"
           placeholder="name"
           value="{{ request.form['name'] }}"/>
        <br>
        <button type="submit">Submit</button>
</form>
</body>
</html>
